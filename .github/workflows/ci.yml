name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codegen-consistency:
    name: Protocol codegen consistency
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check generated files are up to date
        run: python protocol/codegen/generate.py --check
      - name: Check codegen is repeatable
        run: python protocol/codegen/test_repeatable.py

  miniprogram-jest:
    name: Miniprogram Jest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Run tests
        run: npm test

  firmware-unity:
    name: Firmware Unity (PlatformIO native)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run Unity tests (native env)
        run: pio test -e native