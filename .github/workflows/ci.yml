name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codegen-consistency:
    name: Protocol codegen consistency
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check generated files are up to date
        run: python protocol/codegen/generate.py --check
      - name: Check codegen is repeatable
        run: python protocol/codegen/test_repeatable.py

