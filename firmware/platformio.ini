; ESP32-C3 PlatformIO project for bt-model-light firmware.
; See docs/adr/0002-firmware-platformio-arduino.md (PlatformIO + Arduino-ESP32).
; Board: ESP32-C3-FH4 (4MB flash, no PSRAM) — see ADR-0001.
; LED driver: Adafruit NeoPixel (WS2812B via ESP32 RMT) — see ADR-0002/0013.
; Partitions: custom table (nvs + otadata + ota_0/1 + spiffs) — see ADR-0010.
;
; Two envs:
;   esp32-c3-devkitm-1 : real firmware build / flash target.
;   native             : host-run Unity tests for pure-C modules
;                        (protocol_parser, state_machine). See
;                        docs/adr/0003-parser-hardware-decoupling.md and
;                        docs/adr/0012-test-ci-strategy.md. The native
;                        env uses a build_src_filter to compile only
;                        the hardware-free modules under test; the
;                        Arduino/FreeRTOS sources (led_driver, effects,
;                        factory_default, boot_button, watchdog, main)
;                        are excluded because they pull in <Arduino.h>.

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Custom partition table (must be at firmware/partitions.csv).
board_build.partitions = partitions.csv
; 4MB flash (ESP32-C3-FH4).
board_upload.flash_size = 4MB
; Apply Kconfig defaults (Bluedroid BTC task stack bump to avoid stack overflow
; on GATT service discovery; see docs/adr/0016).
board_build.sdkconfig_defaults = sdkconfig.defaults
; Serial console baud for the firmware log (see docs/adr/0026).
monitor_speed = 115200

; LED driver: Adafruit NeoPixel (WS2812B via ESP32 RMT) — ADR-0002.
; FastLED 3.10 was tried first but its PARLIO driver references symbols
; absent on ESP32-C3 (single-core RISC-V, no PARLIO peripheral) and
; fails to link; Adafruit NeoPixel links cleanly on ESP32-C3.
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

build_flags =
    -DCORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------------------
; Native test env — runs pure-C modules under Unity on the host.
; No Arduino, no FreeRTOS, no hardware. Driven by `pio test -e native`.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity

; Compile the src/ modules into the test binary too.
test_build_src = yes
build_src_filter =
    +<protocol_parser.c>
    +<state_machine.cpp>
    +<config.cpp>
    +<effects.cpp>
    +<composition.cpp>
    +<master_output.cpp>
    +<notify.cpp>
    +<led_driver_stub.cpp>
    -<led_driver.cpp>
    -<factory_default.cpp>
    -<boot_button.cpp>
    -<watchdog.cpp>
    -<main.cpp>
    -<config_persist.cpp>
    -<ble_service.cpp>

; Test directories under firmware/test/. Each subdir = one Unity suite.
test_filter =
    test_protocol_parser
    test_state_machine
    test_config
    test_effects
    test_composition
    test_master_output
    test_notify

; Warnings on; tests must compile clean. Unity itself is provided by
; PlatformIO's `test_framework = unity` and does not need lib_deps.
build_flags =
    -Wall
    -Wextra